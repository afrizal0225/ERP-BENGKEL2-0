<!DOCTYPE html>
<html>
<head>
    <title>Delete Raw Material</title>
</head>
<body>
    <h1>Delete Raw Material</h1>
    <p>Are you sure you want to delete "{{ rawmaterial.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{% url 'rawmaterial_list' %}">Cancel</a>
</body>
</html>
