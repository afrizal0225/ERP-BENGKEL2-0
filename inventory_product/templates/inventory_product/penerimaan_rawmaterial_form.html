{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="col-md-6">
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_penerimaan" class="form-label">ID Penerimaan</label>
        <input type="text" class="form-control" id="id_penerimaan" name="id_penerimaan" value="{{ penerimaan.id_penerimaan }}" required>
    </div>
    <div class="mb-3">
        <label for="id_supplier" class="form-label">ID Supplier</label>
        <input type="text" class="form-control" id="id_supplier" name="id_supplier" value="{{ penerimaan.id_supplier }}" required>
    </div>
    <div class="mb-3">
        <label for="tanggal_terima" class="form-label">Tanggal Terima</label>
        <input type="date" class="form-control" id="tanggal_terima" name="tanggal_terima" value="{{ penerimaan.tanggal_terima }}" required>
    </div>
    <div class="mb-3">
        <label for="keterangan" class="form-label">Keterangan</label>
        <textarea class="form-control" id="keterangan" name="keterangan">{{ penerimaan.keterangan }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'penerimaan_rawmaterial_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
