{% extends 'base.html' %}

{% block title %}Add Detail{% endblock %}

{% block content %}
<h1>Add Detail to {{ keluar }}</h1>
<form method="post" class="col-md-6">
    {% csrf_token %}
    <div class="mb-3">
        <label for="tanggal_keluar" class="form-label">Tanggal Keluar</label>
        <input type="date" class="form-control" id="tanggal_keluar" name="tanggal_keluar" required>
    </div>
    <div class="mb-3">
        <label for="BRAND" class="form-label">BRAND</label>
        <input type="text" class="form-control" id="BRAND" name="BRAND" required>
    </div>
    <div class="mb-3">
        <label for="id_product" class="form-label">Product</label>
        <select class="form-control" id="id_product" name="id_product" required>
            {% for product in products %}
            <option value="{{ product.sku }}">{{ product.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="Nama_product" class="form-label">Nama Product</label>
        <input type="text" class="form-control" id="Nama_product" name="Nama_product" required>
    </div>
    <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity" name="quantity" required>
    </div>
    <div class="mb-3">
        <label for="harga_satuan" class="form-label">Harga Satuan</label>
        <input type="number" step="0.01" class="form-control" id="harga_satuan" name="harga_satuan" required>
    </div>
    <div class="mb-3">
        <label for="kategori" class="form-label">Kategori</label>
        <input type="text" class="form-control" id="kategori" name="kategori" required>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'keluar_detail_list' keluar.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
