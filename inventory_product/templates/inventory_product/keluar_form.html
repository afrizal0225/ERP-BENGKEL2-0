{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="col-md-6">
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_keluar" class="form-label">ID Keluar</label>
        <input type="text" class="form-control" id="id_keluar" name="id_keluar" value="{{ keluar.id_keluar }}" required>
    </div>
    <div class="mb-3">
        <label for="tanggal_keluar" class="form-label">Tanggal Keluar</label>
        <input type="date" class="form-control" id="tanggal_keluar" name="tanggal_keluar" value="{{ keluar.tanggal_keluar }}" required>
    </div>
    <div class="mb-3">
        <label for="keterangan" class="form-label">Keterangan</label>
        <textarea class="form-control" id="keterangan" name="keterangan">{{ keluar.keterangan }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'keluar_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
