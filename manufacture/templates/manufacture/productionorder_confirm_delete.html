{% extends 'base.html' %}

{% block title %}Delete Production Order{% endblock %}

{% block content %}
<h1>Delete Production Order</h1>
<p>Are you sure you want to delete "{{ productionorder }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'productionorder_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
