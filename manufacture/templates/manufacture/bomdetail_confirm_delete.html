{% extends 'base.html' %}

{% block title %}Delete BOM Detail{% endblock %}

{% block content %}
<h1>Delete BOM Detail</h1>
<p>Are you sure you want to delete this BOM detail?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'bom_update' bomdetail.id_bom.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
