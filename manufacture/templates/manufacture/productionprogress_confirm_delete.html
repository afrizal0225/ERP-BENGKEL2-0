{% extends 'base.html' %}

{% block title %}Delete Production Progress{% endblock %}

{% block content %}
<h1>Delete Production Progress</h1>
<p>Are you sure you want to delete "{{ progress }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'productionprogress_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
