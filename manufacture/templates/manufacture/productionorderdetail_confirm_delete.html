{% extends 'base.html' %}

{% block title %}Delete Production Order Detail{% endblock %}

{% block content %}
<h1>Delete Production Order Detail</h1>
<p>Are you sure you want to delete this detail for "{{ detail.id_po }}" - "{{ detail.nama_product }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'productionorder_detail' detail.id_po.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
