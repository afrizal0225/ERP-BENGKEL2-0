{% extends 'base.html' %}

{% block title %}Delete SPK{% endblock %}

{% block content %}
<h1>Delete SPK</h1>
<p>Are you sure you want to delete "{{ spk }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'spk_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
