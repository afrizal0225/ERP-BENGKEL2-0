{% extends 'base.html' %}

{% block title %}BOM{% endblock %}

{% block content %}
<h1>BOM</h1>
<div class="mb-3">
    <a href="{% url 'bom_create' %}" class="btn btn-primary">Add BOM</a>
    <a href="{% url 'bom_bulk_create' %}" class="btn btn-secondary">Bulk Upload</a>
</div>
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID BOM</th>
                <th>Product</th>
                <th>Version</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for bom in boms %}
            <tr>
                <td>{{ bom.id_bom }}</td>
                <td>{{ bom.id_product }}</td>
                <td>{{ bom.version }}</td>
                <td>
                    <a href="{% url 'bom_detail' bom.pk %}" class="btn btn-sm btn-info">View Details</a>
                    <a href="{% url 'bom_update' bom.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'bom_delete' bom.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
